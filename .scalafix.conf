# Scalafix rules of the main sources (`sbt scalafixAll`; `sbt check` runs
# `scalafixAll --check`). The test sources use .scalafix-test.conf.
# claude 2026-10-17: changed: DisableSyntax added (purity plan, phase P0)
rules = [OrganizeImports, DisableSyntax]

OrganizeImports {
  targetDialect = Auto
  removeUnused = true
  groupedImports = AggressiveMerge
}

# Impure syntax is an error outside the edge (AGENTS.md, "Purity"). An edge
# file starts with `// scalafix:off DisableSyntax` and one `// EDGE:` line.
# Another permitted site has a line comment
# `// scalafix:ok DisableSyntax.<id>; <phase>: <reason>`, where <phase> is the
# phase that removes the site (P1, P1b, P2 to P6: the phase key in AGENTS.md,
# "Purity") or KEEP (scripts/edge-check.sh).
# The regex rules read the text of the file. Each pattern starts at the start
# of a line and skips a line that starts with `//`, `/*` or `*`, so that a
# comment can name these APIs. The form `regex = { pattern, captureGroup }`
# puts the error on the API (a plain `pattern` key ignores captureGroup).
# claude 2026-10-17: created
DisableSyntax {
  noVars = true
  noNulls = true
  noReturns = true
  noWhileLoops = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noThrows = true
  noFinalize = true
  regex = [
    {
      id = unsafe
      regex = {
        pattern = "(?m)^(?!\\s*(?://|/\\*|\\*)).*?(AllowUnsafe|Sync\\.Unsafe|embrace\\.danger|\\.unsafe\\.)"
        captureGroup = 1
      }
      message = "unsafe Kyo API: only in an edge file"
    }
    {
      id = jvmSync
      regex = {
        pattern = "(?m)^(?!\\s*(?://|/\\*|\\*)).*?(synchronized|@volatile|java\\.util\\.concurrent|new Thread|\\bThread\\()"
        captureGroup = 1
      }
      message = "use a Kyo AtomicRef, Channel, Promise or Fiber"
    }
    {
      id = jvmGlobal
      regex = {
        pattern = "(?m)^(?!\\s*(?://|/\\*|\\*)).*?(System\\.(?:nanoTime|currentTimeMillis|getProperty|setProperty|getenv|exit|out|err|setOut|setErr)|Runtime\\.getRuntime)"
        captureGroup = 1
      }
      message = "use the Kyo Clock, or move the call into an edge file"
    }
    {
      id = nullType
      regex = {
        pattern = "(?m)^(?!\\s*(?://|/\\*|\\*)).*?(\\|\\s*Null\\b)"
        captureGroup = 1
      }
      message = "use Maybe; convert a Java null on the line of the call"
    }
  ]
}
