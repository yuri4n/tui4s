# Scalafix rules of the test sources (Test / scalafixConfig in build.sbt).
# Tests can use fakes, latches and casts, so DisableSyntax is not here.
# claude 2026-10-17: created (purity plan, phase P0)
rules = [OrganizeImports]

OrganizeImports {
  targetDialect = Auto
  removeUnused = true
  groupedImports = AggressiveMerge
}
