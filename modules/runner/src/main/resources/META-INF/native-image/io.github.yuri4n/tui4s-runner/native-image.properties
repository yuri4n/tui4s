# The arguments of GraalVM native-image for an app on tui4s-runner (ADR 0015).
# reachability-metadata.json, next to this file, keeps the crossterm library
# of each platform in the image (the jar of jatatui's crossterm has its own
# JNI metadata) and registers the isatty downcall (internal.Tty). The metadata
# is what the workloads of the examples need (the Counter and the Dashboard in
# a pseudo-terminal); an app that uses more of Kyo or of the JDK can need more
# entries (a Missing...RegistrationError at run time names them).
# --enable-native-access: crossterm is a JNI library, and isatty is a downcall.
# -R:StackSize: the deep stacks of Kyo (-Xss16m in the JVM start scripts).
# JavaArgs: the JVM of the build loads Kyo and Scala, which use sun.misc.Unsafe.
# claude 2026-10-20: created (L5b, ADR 0015): from the native-image spike
JavaArgs = --sun-misc-unsafe-memory-access=allow
Args = -R:StackSize=16777216 --enable-native-access=ALL-UNNAMED
