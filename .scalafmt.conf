version = "3.11.5"

runner.dialect = scala3
align.preset   = most
maxColumn      = 80

indent {
  significant = 4
}

# claude 2026-10-17: changed: `wrap = no` (it was `trailing`) and
# `avoidForSimpleOverflow = [slc]`, for the suppression comments
# `// scalafix:ok DisableSyntax.<id>; <phase>: <reason>` (CONTRIBUTING.md, "Purity"). # claude 2026-10-20: changed: CONTRIBUTING.md (ADR 0021)
# Such a comment must stay one line comment on the line that it suppresses.
# With `trailing`, scalafmt wraps a long trailing comment into a /* */ block,
# and scalafix does not read the block as a suppression. With `slc`, a long
# trailing comment does not make scalafmt break the code before it. The
# comments that exist do not change.
comments {
  wrap = no
  wrapSingleLineMlcAsSlc = true
}

newlines.avoidForSimpleOverflow = [slc]

docstrings {
  style = SpaceAsterisk
  oneline = fold
}

rewrite {
  scala3 {
    convertToNewSyntax = true
    removeOptionalBraces = true
    insertEndMarkerMinLines = 8
    removeEndMarkerMaxLines = 7
  }
  rules = [AsciiSortImports]
  trailingCommas.style = always
}

fileOverride {
  ".sbt" {
    runner.dialect = sbt1
  }
}

# sbt compiles the meta-build (project/*.scala) with Scala 2.12.
fileOverride {
  "glob:**/project/*.scala" {
    runner.dialect = scala212
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
}
