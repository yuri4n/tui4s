name: Release

# One tag = one module release. Tag format: <module>-v<semver>, e.g. core-v0.2.0, zio-v0.1.3.
# Tags are created by scripts/release.sh. Note: GitHub creates no push event when more than
# three tags are pushed at once, so push release tags one by one.
on:
  push:
    tags: ["core-v*", "zio-v*", "cats-v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # gh release create

jobs:
  publish:
    runs-on: ubuntu-latest
    # Holds the secrets. Only tags core-v*, zio-v* and cats-v* can use it.
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^(core|zio|cats)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "::error::Tag '$TAG' does not match <core|zio|cats>-v<semver>"; exit 1
          fi
          echo "module=${BASH_REMATCH[1]}"  >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Tag must point to a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: Test the module
        env:
          MODULE: ${{ steps.tag.outputs.module }}
        run: sbt -v "$MODULE/test"

      - name: Upload to Maven Central (you publish it by hand)
        env:
          MODULE: ${{ steps.tag.outputs.module }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          # sbt-ci-release runs: $CI_CLEAN (default "; clean") ; $CI_RELEASE ; $CI_SONATYPE_RELEASE
          CI_RELEASE: "; ${{ steps.tag.outputs.module }}/assertReleasable; ${{ steps.tag.outputs.module }}/versionCheck; ${{ steps.tag.outputs.module }}/publishSigned"
          # sonaUpload = Central "user managed" deployment: Central validates the bundle, then waits
          # until a human clicks Publish (or Drop) at central.sonatype.com/publishing/deployments.
          # It must run with the module as the current project (the root version is a snapshot).
          CI_SONATYPE_RELEASE: "; project ${{ steps.tag.outputs.module }}; sonaUpload"
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: sbt -v ci-release

      # A draft: publish it after you publish the deployment on Central.
      - name: GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ steps.tag.outputs.module }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match "${MODULE}-v[0-9]*" "${GITHUB_SHA}^" 2>/dev/null || true)
          ARGS=(--title "tui4s-${MODULE} ${VERSION}" --generate-notes --verify-tag --draft)
          [[ -n "$PREV" ]] && ARGS+=(--notes-start-tag "$PREV")
          [[ "$VERSION" == *-* ]] && ARGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${ARGS[@]}"
          {
            echo "## tui4s-${MODULE} ${VERSION} is uploaded, not published"
            echo
            echo "1. Check and publish the deployment: https://central.sonatype.com/publishing/deployments"
            echo "   (or click Drop to cancel the release)."
            echo "2. Publish the draft GitHub release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
