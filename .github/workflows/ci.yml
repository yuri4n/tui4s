name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbt:
    name: Format, compile, test, compatibility
    runs-on: ubuntu-latest
    # claude 2026-10-12: created: sbt-tpolecat CI mode, a warning fails the build (D-8)
    # claude 2026-10-13: changed: TUI4S_LOAD, the load flag of the glitch tests:
    # modules/core/build.sbt gives the test JVM -Dtui4s.load=1, which allows 1
    # split frame in 500 events on a loaded runner (gate 1 item 2; AGENTS.md)
    env:
      SBT_TPOLECAT_CI: "1"
      TUI4S_LOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # dynver and sbt-version-policy read all tags and history
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # Kyo 1.0.0-RC7 needs JDK 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # claude 2026-10-09: added the table test of the release version order
      - name: Release script version order
        run: bash scripts/version-order-test.sh
      # alias: scalafmtCheckAll; scalafmtSbtCheck; Test/compile; test; versionPolicyCheck
      - run: sbt -v check
      - name: Show module versions
        run: sbt -v versions
