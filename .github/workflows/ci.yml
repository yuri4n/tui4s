name: CI

on:
  pull_request:
  push:
    branches: [main]
  # claude 2026-10-19: created: a manual run for a feature branch (D18: no pull requests; CI runs on demand)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbt:
    name: Format, compile, test, compatibility, packaging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # claude 2026-10-12: created: sbt-tpolecat CI mode, a warning fails the build (D-8)
    # claude 2026-10-13: changed: TUI4S_LOAD, the load flag of the glitch tests:
    # runnerTestSettings (build.sbt) gives the test JVM -Dtui4s.load=1, which allows 1
    # split frame in 500 events on a loaded runner (gate 1 item 2; AGENTS.md)
    # claude 2026-10-19: changed: runnerTestSettings, not modules/core/build.sbt (D25)
    env:
      SBT_TPOLECAT_CI: "1"
      TUI4S_LOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # dynver and sbt-version-policy read all tags and history
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # Kyo 1.0.0-RC7 needs JDK 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # claude 2026-10-09: added the table test of the release version order
      - name: Release script version order
        run: bash scripts/version-order-test.sh
      # claude 2026-10-20: created (ADR 0020): the release notes of each module
      # come from CHANGELOG.md (scripts/changelog-section.sh)
      - name: Changelog sections of the release notes
        run: bash scripts/changelog-section-test.sh
      # claude 2026-10-17: created: the edge headers and the phase of each
      # scalafix suppression (CONTRIBUTING.md, "Purity")
      # claude 2026-10-20: changed: CONTRIBUTING.md (ADR 0021)
      - name: Edge files and scalafix suppressions
        run: bash scripts/edge-check.sh
      # codex 2026-10-22: created: validate latency measurement and failure accounting.
      - name: Input measurement and benchmark accounting
        run: |
          python3 -m unittest discover -s examples/ptycheck -p latency_test.py
          python3 -m unittest discover -s bench/harness -p test_perf.py
      # claude 2026-10-20: created (ADR 0022): the logo assets are the outputs
      # of scripts/logo/build.mjs for assets/logo/tui4s.txt; the check compares
      # the text files and the pixel sizes, and it starts no browser
      - name: Logo assets
        run: node scripts/logo/build.mjs --check
      # alias: scalafmtCheckAll; scalafmtSbtCheck; Test/compile;
      # scalafixAll --check; test; versionPolicyCheck
      # claude 2026-10-17: changed: the alias runs scalafixAll --check
      - run: sbt -v check examples/Universal/stage examples/Universal/packageBin
      # claude 2026-10-20: created (L6): the Scaladoc of the six published
      # modules; an error fails the step (a warning does not)
      - name: Scaladoc of the published modules
        run: sbt -v runner/doc app/doc testkit/doc core/doc useJVM/doc widgetsJVM/doc
      - name: Pini4s tests and demo distribution
        working-directory: vendor/pini4s
        run: sbt check demo/Universal/stage demo/Universal/packageBin
      - name: Run the packaged pini4s demo
        working-directory: vendor/pini4s
        run: demo/target/universal/stage/bin/pini4s-demo
      - name: Keep runnable distributions
        uses: actions/upload-artifact@v7
        with:
          name: example-distributions
          path: |
            examples/target/universal/*.zip
            vendor/pini4s/demo/target/universal/*.zip
          if-no-files-found: error
      - name: Show module versions
        run: sbt -v versions

  nix:
    name: Nix development shell evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10 # claude 2026-10-20: created (review fix): every job has a limit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Evaluate the tui4s development shell
        run: nix flake check --all-systems --no-build --no-update-lock-file
      - name: Evaluate the pini4s development shell
        working-directory: vendor/pini4s
        run: nix flake check --all-systems --no-build --no-update-lock-file

  # claude 2026-10-13: created (T1, OS-41): the real-terminal checklist;
  # 2026-10-20: changed (L5b, L6): macOS too (the crossterm jar of
  # jatatui 0.31.0 holds libnative-arm64-darwin-crossterm.dylib and
  # libnative-x86_64-darwin-crossterm.dylib); a second run with the AOT
  # caches of the examples (ADR 0015)
  terminal:
    name: Real-terminal checklist (pseudo-terminal, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # SBT_TPOLECAT_CI: the sbt step of run.sh (examples/launchers) compiles
    # with the CI flags, as the sbt job does. TUI4S_LOAD is for the glitch
    # tests of the core (the integration suites), which this job does not run.
    # claude 2026-10-19: changed: the integration suites of the core (D25)
    env:
      SBT_TPOLECAT_CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # Kyo 1.0.0-RC7 needs JDK 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # claude 2026-10-13: changed (T1, reviews R3-1, R3-2): apt-get update
      # first (the package index of the image can be old); the logs of a
      # failed run are kept as an artifact
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect
      # Starts each example in a pseudo-terminal, sends keys and signals,
      # checks the screens and that the terminal is restored
      # (examples/README.md). The runner has no JAVA_TOOL_OPTIONS; run.sh
      # unsets it for the app anyway.
      # claude 2026-10-13: changed (T2): every example, not only the Counter
      - run: examples/ptycheck/run.sh
        env:
          PTY_WORK: ${{ runner.temp }}/ptycheck
      # codex 2026-10-22: created: verify real input and diagnostic wiring on both terminal platforms.
      - name: Settlement input and diagnostics
        env:
          PTY_WORK: ${{ runner.temp }}/ptycheck
        run: |
          JAVA_OPTS="-Dtui4s.diagnostics.file=$PTY_WORK/diagnostics.json" \
            python3 examples/ptycheck/latency.py --keys 10 --rate 10 --deadline-ms 2000 \
              --output "$PTY_WORK/latency.json" --command examples/target/bin/settlement
          python3 examples/ptycheck/diagnostics_check.py "$PTY_WORK/diagnostics.json" "$PTY_WORK/latency.json"
      # The same checklist with the AOT cache of each example (bin/aot-train
      # of the distribution; the start scripts then use the caches). aot-train
      # fails when the JVM cannot use a cache that it made (-XX:AOTMode=on).
      # claude 2026-10-20: changed (review fix): the check of each cache
      - name: Train the AOT caches of the examples
        run: examples/target/bin/aot-train
      - name: The checklist with the AOT caches
        run: examples/ptycheck/run.sh
        env:
          PTY_SKIP_BUILD: "1"
          PTY_WORK: ${{ runner.temp }}/ptycheck-aot
      - name: Keep the logs of a failed checklist
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ptycheck-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ptycheck
            ${{ runner.temp }}/ptycheck-aot
          if-no-files-found: ignore

  # claude 2026-10-20: created (L6): the assistant on the web, in headless
  # Chromium (scripts/web-smoke.mjs). The version of Playwright is the one
  # that the smoke was written with.
  web:
    name: Web assistant (Scala.js, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SBT_TPOLECAT_CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # Kyo 1.0.0-RC7 needs JDK 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Link the web assistant (dist/assistant)
        run: bash scripts/web-build.sh
      - name: Install Playwright and Chromium
        run: |
          npm install --global playwright@1.56.1
          npx playwright@1.56.1 install --with-deps chromium
      - name: Smoke test in Chromium
        run: node scripts/web-smoke.mjs
      - name: Keep the screenshot of a failed smoke
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke
          path: dist/web-smoke.png
          if-no-files-found: ignore
